<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessoria Bonamigo</title>
    <style>
        :root {
            --primary-color: #d4af37;
            --dark-bg: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-light: #f0f0f0;
            --text-muted: #b0b0b0;
            --accent: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1f1f1f 100%);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 2px solid var(--primary-color);
        }

        header h1 {
            font-size: 2.5em;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-button {
            padding: 12px 24px;
            background: var(--card-bg);
            border: 2px solid var(--text-muted);
            color: var(--text-light);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .tab-button:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: var(--primary-color);
            color: var(--dark-bg);
            border-color: var(--primary-color);
        }

        .search-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 1em;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        #searchInput::placeholder {
            color: var(--text-muted);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .exercicios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .exercicio-card {
            background: var(--card-bg);
            border: 2px solid var(--text-muted);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .exercicio-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .exercicio-titulo {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .exercicio-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .info-label {
            font-weight: 600;
            color: var(--primary-color);
            min-width: 70px;
        }

        .info-value {
            color: var(--text-light);
            flex: 1;
        }

        .exercicio-comentario {
            background: rgba(212, 175, 55, 0.1);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--primary-color);
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.95em;
        }

        .video-link {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color) 0%, #e6c200 100%);
            color: var(--dark-bg);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .video-link:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .exercicios-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-direction: column;
            }

            .tab-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💪 Acessoria Bonamigo</h1>
            <p class="subtitle">Acesso rápido aos exercícios e vídeos</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" data-category="força-soltando">
                Força e Soltando o Jogo
            </button>
            <button class="tab-button" data-category="soltando-blindagem">
                Soltando o Jogo e Blindagem
            </button>
        </div>

        <div class="search-bar">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="🔍 Pesquisar exercício..."
            >
        </div>

        <div class="content">
            <div id="força-soltando" class="tab-content active">
                <div id="exercicios-força" class="exercicios-grid"></div>
            </div>
            <div id="soltando-blindagem" class="tab-content">
                <div id="exercicios-soltando" class="exercicios-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // Dados - Força e Soltando o Jogo
        const dadosForçaSoltando = [
            {
                nome: "Agachamento Livre",
                cargas: "60kg",
                series: "4x5",
                repeticoes: "5 reps",
                comentario: "Manter as costas retas e quadril abaixo do joelho",
                videoUrl: "https://youtu.be/exemplo1"
            },
            {
                nome: "Supino Reto",
                cargas: "80kg",
                series: "4x5",
                repeticoes: "5 reps",
                comentario: "Baixar até ao peito, explosivo na subida",
                videoUrl: "https://youtu.be/exemplo2"
            },
            {
                nome: "Rosca Direta",
                cargas: "30kg",
                series: "3x8",
                repeticoes: "8 reps",
                comentario: "Cotovelos junto ao corpo, movimento controlado",
                videoUrl: "https://youtu.be/exemplo3"
            }
        ];

        // Dados - Soltando o Jogo e Blindagem
        const dadosSoltandoBlindagem = [
            {
                nome: "Leg Press",
                cargas: "150kg",
                series: "4x10",
                repeticoes: "10 reps",
                comentario: "Amplitude completa, não bloquear os joelhos no topo",
                videoUrl: "https://youtu.be/exemplo4"
            },
            {
                nome: "Desenvolvimento de Ombros",
                cargas: "35kg",
                series: "3x8",
                repeticoes: "8 reps",
                comentario: "Pescoço protegido, movimento vertical",
                videoUrl: "https://youtu.be/exemplo5"
            },
            {
                nome: "Encolhimento de Ombros",
                cargas: "50kg",
                series: "4x12",
                repeticoes: "12 reps",
                comentario: "Elevar o máximo possível, pulso neutro",
                videoUrl: "https://youtu.be/exemplo6"
            }
        ];

        // Tabs switching
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                const category = button.getAttribute('data-category');
                
                // Remove active class from all buttons and contents
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                // Add active class to clicked button and corresponding content
                button.classList.add('active');
                document.getElementById(category).classList.add('active');
                
                // Reset search
                document.getElementById('searchInput').value = '';
                renderExercicios();
            });
        });

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', renderExercicios);

        // Render exercícios
        function renderExercicios() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const activeTab = document.querySelector('.tab-content.active');
            const category = activeTab.id;
            
            let exercicios = [];
            let containerId = '';
            
            if (category === 'força-soltando') {
                exercicios = dadosForçaSoltando;
                containerId = 'exercicios-força';
            } else if (category === 'soltando-blindagem') {
                exercicios = dadosSoltandoBlindagem;
                containerId = 'exercicios-soltando';
            }
            
            // Filter by search term
            const filtered = exercicios.filter(ex => {
                const nome = (ex.nome || '').toLowerCase();
                const comentario = (ex.comentario || '').toLowerCase();
                return nome.includes(searchTerm) || comentario.includes(searchTerm);
            });
            
            const container = document.getElementById(containerId);
            
            if (filtered.length === 0) {
                if (searchTerm) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <h3>Nenhum exercício encontrado</h3>
                            <p>Tente outra busca</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <h3>Sem exercícios</h3>
                            <p>Adicione exercícios aos dados</p>
                        </div>
                    `;
                }
                return;
            }
            
            container.innerHTML = filtered.map(ex => `
                <div class="exercicio-card">
                    <div class="exercicio-titulo">${ex.nome}</div>
                    
                    <div class="exercicio-info">
                        ${ex.cargas ? `
                            <div class="info-item">
                                <span class="info-label">⚙️ Cargas:</span>
                                <span class="info-value">${ex.cargas}</span>
                            </div>
                        ` : ''}
                        
                        ${ex.series ? `
                            <div class="info-item">
                                <span class="info-label">📊 Séries:</span>
                                <span class="info-value">${ex.series}</span>
                            </div>
                        ` : ''}
                        
                        ${ex.repeticoes ? `
                            <div class="info-item">
                                <span class="info-label">🔄 Reps:</span>
                                <span class="info-value">${ex.repeticoes}</span>
                            </div>
                        ` : ''}
                    </div>
                    
                    ${ex.comentario ? `
                        <div class="exercicio-comentario">
                            "${ex.comentario}"
                        </div>
                    ` : ''}
                    
                    ${ex.videoUrl ? `
                        <a href="${ex.videoUrl}" target="_blank" class="video-link">
                            ▶️ Ver Vídeo
                        </a>
                    ` : ''}
                </div>
            `).join('');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', renderExercicios);
    </script>
</body>
</html>
